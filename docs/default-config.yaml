# oc-precheck configuration — generated by "oc precheck config default".
#
# Usage:    oc precheck --config precheck.yaml      (or OCP_PRECHECK_CONFIG=precheck.yaml)
# Validate: oc precheck config validate --config precheck.yaml
#
# Precedence: built-in defaults < this file < command-line flags.
# Unknown keys are rejected to catch typos. Every value below is the default:
# delete what you do not need to change.

# ---------------------------------------------------------------------------
# settings: equivalent of the command-line flags
# ---------------------------------------------------------------------------
settings:
  failOn: crit                       # crit | warn: level giving a non-zero exit code
  # checks: [etcd, mcp, pdb]         # subset of checks (default: all)
  # skip: [csr]                      # checks to skip
  # targetVersion: 4.18.24           # validated against the update graph
  maxRows: 50
  alertSeverities: [critical, warning]
  ignoreAlerts: [Watchdog, AlertmanagerReceiversNotConfigured, InfoInhibitor]
  alertmanagerURL: http://localhost:9093
  monitoringNamespace: openshift-monitoring
  etcdNamespace: openshift-etcd
  etcdFragThreshold: 45                # percent of reclaimable space
  etcdDBSizeWarn: 6Gi
  etcdExpectedMembers: 3
  zoneLabel: topology.kubernetes.io/zone
  groupByLabels: []                  # e.g. [example.com/room, node-role.kubernetes.io/infra]
  # nodeSelector: node-role.kubernetes.io/worker
  nodePodCapacityPct: 90
  podPendingAge: 5m
  podNotReadyAge: 0s                   # 0s = report Running pods not ready (0/1) immediately
  podTerminatingAge: 10m
  podRestartWarn: 10
  quotaThreshold: 90
  jobLongDuration: 1h
  hcpFilter: []                      # hub only, globs on name or namespace/name

# ---------------------------------------------------------------------------
# severities: per-rule severity — crit | warn | info | "off"
# Globs are accepted ("pods.*": info); the most specific pattern wins.
# Quote "off": unquoted, YAML 1.1 reads it as a boolean (also accepted).
# ---------------------------------------------------------------------------
severities:
  # clusterversion
  cv.failing:                 crit  # ClusterVersion Failing=True
  cv.unavailable:             crit  # ClusterVersion Available=False
  cv.progressing:             warn  # an update is already in progress
  cv.not-upgradeable:         warn  # Upgradeable=False (minor updates blocked)
  cv.updates-not-retrieved:   warn  # the update service cannot be reached
  cv.release-not-accepted:    crit  # ReleaseAccepted=False
  cv.history-partial:         warn  # the last update did not complete
  cv.overrides:               warn  # unmanaged spec.overrides are set
  cv.target-conditional:      warn  # the target version is a conditional update
  cv.target-unknown:          crit  # the target version is not in the update graph
  cv.minor-blocked:           crit  # minor update requested while Upgradeable=False
  # alerts
  alerts.critical:            crit  # firing alert with severity critical
  alerts.warning:             warn  # firing alert with severity warning
  alerts.other:               info  # firing alert with another severity
  alerts.suppressed:          info  # silenced or inhibited alert
  # silences
  silences.active:            info  # active Alertmanager silence
  silences.match-all:         warn  # silence muting every alert
  # etcd
  etcd.members-degraded:      crit  # etcd operator EtcdMembersDegraded=True
  etcd.member-unhealthy:      crit  # etcd member unhealthy or unreachable
  etcd.pod-missing:           warn  # etcd member without an etcd pod
  etcd.pod-not-ready:         crit  # etcd pod not Ready
  etcd.no-leader:             crit  # no etcd leader
  etcd.member-count:          warn  # number of members differs from the expected count
  etcd.version-mismatch:      warn  # etcd members run different versions
  etcd.alarm:                 crit  # active etcd alarm (NOSPACE…)
  etcd.fragmentation:         warn  # fragmentation above the threshold
  etcd.db-size:               warn  # database size above the threshold
  # clusteroperators
  co.unavailable:             crit  # ClusterOperator Available=False
  co.degraded:                crit  # ClusterOperator Degraded=True
  co.progressing:             warn  # ClusterOperator Progressing=True
  co.not-upgradeable:         warn  # ClusterOperator Upgradeable=False
  co.version-mismatch:        warn  # operator version differs from the cluster version
  # olm
  olm.csv-failed:             crit  # CSV in phase Failed
  olm.csv-not-succeeded:      warn  # CSV in a phase other than Succeeded
  olm.sub-resolution-failed:  crit  # Subscription ResolutionFailed
  olm.sub-installplan-failed: crit  # Subscription InstallPlanFailed
  olm.sub-catalog-unhealthy:  warn  # Subscription with unhealthy CatalogSources
  olm.sub-manual-pending:     warn  # InstallPlan waiting for manual approval
  olm.sub-upgrade-pending:    warn  # operator update pending
  olm.sub-no-state:           warn  # Subscription without state
  olm.catalog-not-ready:      warn  # CatalogSource not READY
  # mcp
  mcp.degraded:               crit  # pool degraded
  mcp.updating:               warn  # pool update in progress
  mcp.paused:                 warn  # pool paused
  mcp.node-orphan:            warn  # node outside any pool
  mcp.node-multi-pool:        warn  # node in several custom pools
  mcp.node-degraded:          crit  # machine-config-daemon Degraded on the node
  mcp.node-working:           warn  # machine-config-daemon Working on the node
  mcp.node-config-mismatch:   warn  # currentConfig differs from desiredConfig
  # pdb
  pdb.violated:               warn  # PDB violated (healthy < desired)
  pdb.blocking:               warn  # PDB allowing 0 disruptions: will block drains
  pdb.empty:                  info  # PDB selecting no pod
  # nodes
  nodes.not-ready:            crit  # node NotReady
  nodes.cordoned:             warn  # node SchedulingDisabled
  nodes.pressure:             warn  # Memory/Disk/PID pressure
  nodes.pod-capacity:         warn  # pod capacity usage above the threshold
  # pods
  pods.not-ready:             warn  # Running pod with containers not ready (0/1…)
  pods.waiting-error:         warn  # CrashLoopBackOff, ImagePullBackOff, CreateContainerConfigError…
  pods.pending:               warn  # pod Pending longer than the threshold
  pods.terminating:           warn  # pod stuck in Terminating
  pods.unknown:               warn  # pod in phase Unknown
  pods.failed:                info  # pod in phase Failed (Evicted, Error…)
  pods.restarts:              info  # high restart count
  # jobs
  jobs.running:               info  # running Job
  jobs.long-running:          warn  # Job running longer than the threshold
  # quotas
  quotas.high:                warn  # quota usage above the threshold on at least one resource
  quotas.full:                warn  # quota exhausted (100 %)
  # csr
  csr.pending:                warn  # CSR waiting for approval
  # hostedclusters
  hcp.unavailable:            crit  # HostedCluster Available≠True
  hcp.degraded:               crit  # HostedCluster Degraded=True
  hcp.etcd-unavailable:       crit  # EtcdAvailable=False
  hcp.kas-unavailable:        crit  # KubeAPIServerAvailable=False
  hcp.cv-failing:             crit  # ClusterVersionSucceeding=False
  hcp.invalid-release:        crit  # ValidReleaseImage=False
  hcp.progressing:            warn  # HostedCluster update in progress
  hcp.not-upgradeable:        warn  # ClusterVersionUpgradeable=False
  hcp.reconciliation-paused:  warn  # reconciliation paused (pausedUntil)
  hcp.cp-pods:                warn  # hosted control plane pods not ready
  hcp.acm-unavailable:        warn  # ACM ManagedCluster not Available
  hcp.np-not-ready:           crit  # NodePool Ready=False
  hcp.np-unhealthy-nodes:     crit  # NodePool AllNodesHealthy=False
  hcp.np-updating:            warn  # NodePool UpdatingVersion/UpdatingConfig
  hcp.np-replicas:            warn  # NodePool current replicas differ from desired
  hcp.np-version-skew:        warn  # NodePool version differs from the control plane

# ---------------------------------------------------------------------------
# exclusions: ignore some objects for a rule (globs).
#   rule:       rule ID or pattern (default "*": every rule)
#   namespaces: at least one must match when set
#   names:      at least one must match when set
# ---------------------------------------------------------------------------
exclusions: []
# - rule: "pods.*"
#   namespaces: ["sandbox-*", "*-dev"]
#   reason: sandbox environments
# - rule: pdb.blocking
#   namespaces: [openshift-storage]
#   reason: managed by the ODF operator
# - rule: alerts.warning
#   names: [KubeCPUOvercommit, KubeMemoryOvercommit]

# ---------------------------------------------------------------------------
# customRules: your own rules written in CEL, the language used by
# ValidatingAdmissionPolicies. "expr" must be TRUE for a compliant object.
#
#   id                          lowercase id, usable in severities / exclusions
#   apiVersion, resource        target type (resource is plural: deployments…)
#   namespaces, labelSelector,
#   fieldSelector               server-side filtering (optional)
#   match                       CEL pre-filter (optional)
#   expr                        compliance condition (required)
#   aggregate: true             expr evaluated once on the "objects" list
#   severity                    crit | warn (default) | info | "off"
#   message, messageExpression  violation message
#   params                      values available as params.xxx
#
# Variables: object, objects, params, now (timestamp), clusterVersion,
# hostedControlPlane. Libraries: standard CEL + strings, sets, lists, math.
# Use has() for optional fields.
# ---------------------------------------------------------------------------
